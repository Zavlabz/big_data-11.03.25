version: '3.8'

services:
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
    environment:

      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=123
    healthcheck:
      test: ["CMD-SHELL","curl -sSf http://localhost:8123/ping"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  clickhouse_data:
